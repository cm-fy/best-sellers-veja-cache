name: Fetch VEJA Best Sellers

on:
  schedule:
    # Run every Sunday at 04:00 UTC (Veja weekly updates)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      enrich:
        description: 'Crawl book detail pages for full synopsis (VEJA_DETAILS=1)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch and enrich VEJA bestseller lists
        env:
          VEJA_DETAILS: ${{ github.event.inputs.enrich == 'false' && '' || '1' }}
        run: python3 fetch_veja.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A veja/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update VEJA cache $(date -u +%Y-%m-%d)"
            git push
          fi
